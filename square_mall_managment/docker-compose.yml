version: '3.8'

services:
  db:
    image: postgres:15.2
    container_name: squaremall
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=squaremall
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=1234
    ports:
      - "5433:5432"

  mongodb:
    image: mongo:6.0
    container_name: squaremall_mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=1234
    ports:
      - "27017:27017"


volumes:
  postgres_data:
  mongodb_data: